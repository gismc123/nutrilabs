gzip on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server_tokens off;

# Behind the Cloudflare tunnel the original scheme arrives in X-Forwarded-Proto;
# pass it on so the API knows the browser used HTTPS (Secure cookies).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    include /etc/nginx/snippets/security-headers.conf;

    # The pricer service calls the API directly on the Docker network; its feed
    # (every user's store choices and list items) is never served publicly.
    location ^~ /api/pricer/ {
        return 404;
    }

    # Proxy /api/* to the API service
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # No dotfiles (.env, .git) even if one ever lands in the web root.
    location ~ /\. {
        return 404;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache index.html (so new deploys are picked up immediately)
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Fall back to index.html for React Router client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
