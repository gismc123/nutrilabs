services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Localhost only: the database must never be reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET}
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY}
      THEMEALDB_API_KEY: ${THEMEALDB_API_KEY:-}
      USDA_API_KEY: ${USDA_API_KEY}
      NODE_ENV: ${NODE_ENV}
      PRICER_URL: http://pricer:4010
      PRICER_TOKEN: ${PRICER_TOKEN}
      BASE_URL: ${BASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NutriLabs}
      # Deals (apps/api/src/deals): the coupon worker's shared token, and limits.
      DEALS_WORKER_TOKEN: ${DEALS_WORKER_TOKEN:-}
      KROGER_DAILY_PRODUCT_BUDGET: ${KROGER_DAILY_PRODUCT_BUDGET:-6000}
      DEALS_PRICE_SYNC_CRON: ${DEALS_PRICE_SYNC_CRON:-30 4 * * *}
      DEALS_TZ: ${DEALS_TZ:-America/Chicago}
      DEALS_COUPON_SYNC_TIME: ${DEALS_COUPON_SYNC_TIME:-03:45}
    networks:
      default:
        aliases:
          - nutrilabs-api

  # Standalone Kroger price service for the Shop list (apps/pricer). Talks to
  # NutriLabs only over HTTP.
  pricer:
    build:
      context: ./apps/pricer
    restart: unless-stopped
    expose:
      - "4010"
    environment:
      PRICER_TOKEN: ${PRICER_TOKEN}
      NUTRILABS_URL: http://nutrilabs-api:3001
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET}
      TZ: ${PRICER_TZ:-America/Chicago}
    volumes:
      - pricer_data:/data

  # Deals coupon reader (apps/deals-worker). Never started by "up" or deploy.sh:
  # apps/deals-worker/scripts/run-worker.sh runs it on the desktop display, because
  # Kroger blocks headless browsers. Read-only: it never clips coupons.
  deals-worker:
    build:
      context: ./apps/deals-worker
    image: nutrilabs-deals-worker
    profiles: ["deals-worker"]
    init: true
    user: "1000:1000"
    shm_size: 1gb
    depends_on:
      - api
    environment:
      DISPLAY: ${DEALS_DISPLAY:-:0}
      DEALS_VIRTUAL_DISPLAY: ${DEALS_VIRTUAL_DISPLAY:-0}
      XAUTHORITY: /tmp/.Xauth
      DEALS_INGEST_URL: http://api:3001/api/deals
      DEALS_WORKER_TOKEN: ${DEALS_WORKER_TOKEN:-}
      DEALS_ALLOW_SIGNED_OUT: ${DEALS_ALLOW_SIGNED_OUT:-true}
      KROGER_DOMAIN: ${KROGER_DOMAIN:-kroger.com}
    volumes:
      - ${XAUTH_FILE:-/dev/null}:/tmp/.Xauth:ro
      - /tmp/.X11-unix:/tmp/.X11-unix-host:ro
      # Browser profile and the last raw run live outside the repo.
      - ${DEALS_STATE_DIR:-/tmp/nutrilabs-deals}/browser-profile:/profile
      - ${DEALS_STATE_DIR:-/tmp/nutrilabs-deals}/state:/state
      - ./apps/deals-worker/samples:/samples

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "1042:80"

volumes:
  postgres_data:
  pricer_data:
