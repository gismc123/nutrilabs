services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Localhost only: the database must never be reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET}
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY}
      THEMEALDB_API_KEY: ${THEMEALDB_API_KEY:-}
      USDA_API_KEY: ${USDA_API_KEY}
      NODE_ENV: ${NODE_ENV}
      PRICER_URL: http://pricer:4010
      PRICER_TOKEN: ${PRICER_TOKEN}
      BASE_URL: ${BASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NutriLabs}
    networks:
      default:
        # Unique name: the pricer also joins HeadlessX's network, which has its own "api".
        aliases:
          - nutrilabs-api

  # Standalone grocery price service (apps/pricer). Talks to NutriLabs only over
  # HTTP, and to HeadlessX (separate compose project) over its docker network.
  pricer:
    build:
      context: ./apps/pricer
    restart: unless-stopped
    expose:
      - "4010"
    environment:
      PRICER_TOKEN: ${PRICER_TOKEN}
      NUTRILABS_URL: http://nutrilabs-api:3001
      HEADLESSX_URL: http://headlessx-api:8000
      HEADLESSX_API_KEY: ${HEADLESSX_API_KEY}
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET}
      TZ: ${PRICER_TZ:-America/Chicago}
    volumes:
      - pricer_data:/data
    networks:
      - default
      - headlessx

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "1042:80"

volumes:
  postgres_data:
  pricer_data:

networks:
  headlessx:
    name: headlessx_headlessx-network
    external: true
